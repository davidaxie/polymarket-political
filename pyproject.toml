[project]
name = "polymarket-political"
version = "0.1.0"
description = "Polymarket Insider-Flow Backtest"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "matplotlib>=3.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.0", "jupyter>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
